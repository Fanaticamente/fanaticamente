<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" id="app-viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!--
      Ajusta o viewport ANTES do React montar:
      - PWA standalone (lojas via WebView/Capacitor) → viewport mobile nativo
      - Navegador (Safari iPhone, Chrome Android, etc.) → força viewport desktop (1280px)
        para o usuário ver o site igual ao computador, com pinch/zoom liberado.
    -->
    <script>
      (function () {
        try {
          var isStandalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
            window.navigator.standalone === true;
          var isTouch =
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
            'ontouchstart' in window ||
            (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

          var viewportEl = document.getElementById('app-viewport');
          if (!viewportEl) return;

          if (isTouch && !isStandalone) {
            // Navegador mobile: força layout desktop visível em zoom-out
            viewportEl.setAttribute(
              'content',
              'width=1280, initial-scale=' + (window.innerWidth / 1280) + ', user-scalable=yes, viewport-fit=cover'
            );
            document.documentElement.setAttribute('data-force-desktop', 'true');
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>

    <!-- Prevent layout flash before Tailwind loads -->
    <style>
      /* Prevent layout flash before Tailwind loads */
      @media (min-width: 768px) {
        [data-layout="mobile"] { display: none !important; }
      }
      @media (max-width: 767.98px) {
        [data-layout="desktop"] { display: none !important; }
      }
      /* Quando forçamos viewport desktop no navegador mobile, usar regras desktop */
      html[data-force-desktop="true"] [data-layout="mobile"] { display: none !important; }
      html[data-force-desktop="true"] [data-layout="desktop"] { display: block !important; }

      /* Base: avoid locking document height on desktop (keeps native scrollbar working) */
      html, body {
        overflow-x: hidden;
        overscroll-behavior: auto;
      }

      /* Mobile/PWA: lock to viewport + hide scrollbars */
      @media (max-width: 768px) {
        html, body {
          height: 100%;
          -webkit-overflow-scrolling: touch;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        *::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
          background: transparent !important;
        }
      }

      /* Desktop: native scrollbar only, no gutter reservation */
      @media (min-width: 769px) {
        html, body {
          height: auto !important;
          min-height: 100% !important;
          overflow-y: auto !important;
        }
      }

      /* iOS safe area support */
      html {
        background-color: #0a0a0a;
      }
      body {
        background-color: #0a0a0a;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      #root {
        background-color: #0a0a0a;
        min-height: 100vh;
      }
      /* Initial splash to prevent white flash before React mounts */
      #initial-splash {
        position: fixed;
        inset: 0;
        background-color: #0a0a0a;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease-out;
      }
      #initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <!-- Restore last in-app route BEFORE React mounts (prevents flash to Home on iOS/PWA resume) -->
    <script>
      (function () {
        const ROUTE_STORAGE_KEY = "fanatica_last_route";
        const PUBLIC_PREFIXES = ["/auth", "/admin-access", "/setup-test"]; // must match app hook
        const isPublic = (p) => PUBLIC_PREFIXES.some((r) => p && p.startsWith(r));

        try {
          const current = window.location.pathname + window.location.search;
          if (window.location.pathname !== "/") return;

          const saved = window.localStorage.getItem(ROUTE_STORAGE_KEY);
          if (!saved) return;
          if (saved === "/") return;
          if (isPublic(saved)) return;

          // Avoid no-op loops
          if (saved === current) return;

          window.history.replaceState(null, "", saved);
        } catch {
          // ignore
        }
      })();
    </script>

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ee9e552b-bb58-4c43-ba7c-59dfc62700d7",
          safari_web_id: "web.onesignal.auto.ee9e552b-bb58-4c43-ba7c-59dfc62700d7",
          notifyButton: {
            enable: false,
          },
          allowLocalhostAsSecureOrigin: true,
        });

        // Request permission automatically for PWA standalone mode or when already granted
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
          || window.navigator.standalone === true;
        
        if (isStandalone) {
          // In PWA mode, request push permission after a short delay
          setTimeout(async () => {
            try {
              const currentPermission = OneSignal.Notifications.permission;
              if (!currentPermission) {
                await OneSignal.Notifications.requestPermission();
                console.log("[OneSignal] Push permission requested in PWA mode");
              }
            } catch(e) {
              console.warn("[OneSignal] Permission request failed:", e);
            }
          }, 3000);
        }
      });
    </script>

  <body>
    <div id="initial-splash"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide initial splash once React has mounted content
      (function () {
        const splash = document.getElementById('initial-splash');
        if (!splash) return;
        const root = document.getElementById('root');
        const hide = () => {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 500);
        };
        // Watch for any child added to #root (means React mounted)
        const observer = new MutationObserver(() => {
          if (root && root.children.length > 0) {
            observer.disconnect();
            hide();
          }
        });
        if (root) observer.observe(root, { childList: true });
        // Safety fallback
        setTimeout(hide, 5000);
      })();
    </script>
  </body>
